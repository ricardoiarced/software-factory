[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = ["platformdirs>=4"]

[project.scripts]
factory = "factory:main"

[tool.setuptools]
py-modules = ["factory", "_harness", "_runrecord", "_rungate", "_codex", "_claude", "_publisher", "_identity", "_project", "_project_guidance", "_project_registry", "_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_host_certification: certifies one selected real Harness artifact and host tuple",
]

[dependency-groups]
dev = ["pytest", "platformdirs", "build", "ruff==0.17.0", "pyright==1.1.414"]

[tool.ruff]
target-version = "py311"
required-version = "==0.17.0"

[tool.ruff.lint]
extend-select = ["ANN", "TID251", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc.ABC".msg = "Use typing.Protocol for architectural contracts instead of abc.ABC (AGENTS.md ## Conventions)."

[tool.pyright]
include = [
    "factory.py",
    "_harness.py",
    "_runrecord.py",
    "_rungate.py",
    "_codex.py",
    "_claude.py",
    "_publisher.py",
    "_identity.py",
    "_project.py",
    "_project_guidance.py",
    "_project_registry.py",
    "_doctor.py",
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
