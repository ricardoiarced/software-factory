[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["platformdirs>=4"]

[project.scripts]
factory = "factory:main"

[tool.setuptools]
py-modules = ["factory", "_harness", "_codex", "_claude", "_publisher", "_project", "_project_guidance", "_project_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_host_certification: certifies one selected real Harness artifact and host tuple",
]

[dependency-groups]
dev = ["pytest", "platformdirs", "build", "ruff", "pyright"]

[tool.ruff]
target-version = "py311"

[tool.pyright]
include = [
    "factory.py",
    "_harness.py",
    "_codex.py",
    "_claude.py",
    "_publisher.py",
    "_project.py",
    "_project_guidance.py",
    "_project_registry.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
