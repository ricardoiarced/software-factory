[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["platformdirs>=4"]

[project.scripts]
factory = "factory:main"

[tool.setuptools]
py-modules = ["factory", "_codex", "_project"]
